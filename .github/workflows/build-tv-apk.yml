name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      invidious_url:
        description: 'Default Invidious Instance URL (e.g., http://192.168.1.100:3000)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'materialious/**'
      - '.github/workflows/build-tv-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Xiaomi Google TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install root dependencies
        working-directory: ./materialious
        run: npm ci

      - name: Install embedded Android Node.js dependencies
        working-directory: ./materialious/static/nodejsAndroid
        run: npm ci || true

      - name: Build web application
        working-directory: ./materialious
        env:
          PUBLIC_DEFAULT_INVIDIOUS_INSTANCE: ${{ inputs.invidious_url || github.event.inputs.invidious_url || 'http://192.168.1.11:3000' }}
        run: npm run build

      - name: Sync with Capacitor Android
        working-directory: ./materialious
        run: |
          npx cap sync android
          npm prune --omit=dev

      - name: Build Android Release APKs
        working-directory: ./materialious/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APKs
        run: |
          # Use stable repository release.keystore
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias materialious -keyalg RSA -keysize 2048 -validity 10000 -storepass materialious -keypass materialious -dname "CN=Materialious TV, OU=Materialious, O=Materialious, L=Local, S=Local, C=VN"
          fi

          # Find the latest apksigner in Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          mkdir -p signed_apks

          for apk in materialious/android/app/build/outputs/apk/release/*unsigned.apk; do
            if [ -f "$apk" ]; then
              base_name=$(basename "$apk" -unsigned.apk)
              signed_apk="signed_apks/${base_name}-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:materialious --ks-key-alias materialious --key-pass pass:materialious --out "$signed_apk" "$apk"
            fi
          done

          ls -la signed_apks/

      - name: Upload Signed TV APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Materialious-Xiaomi-Google-TV-APK
          path: signed_apks/app-universal-release-signed.apk
          retention-days: 30
